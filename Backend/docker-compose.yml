# Ellipse local stack — shared SQL Server (EllipseDB) + Flowable workflow
# API and workflow use the SAME catalog: EllipseDB (Flowable ACT_* tables alongside EF).
#
# Recommended (TCP — works for .NET + Java JDBC):
#   docker compose up -d sqlserver
#   .\scripts\migrate-localdb-to-shared-sql.ps1   # optional: copy existing LocalDB data
#   docker compose up --build workflow
#
# LocalDB-only API (no Java JDBC): keep using (localdb)\MSSQLLocalDB without this stack.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ellipse-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ELLIPSE_SQL_SA_PASSWORD:-Ellipse_Dev_Sql_2026!}
    ports:
      - "1433:1433"
    volumes:
      - ellipse-sql-data:/var/opt/mssql
      - ./\.data/mssql/backup:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  workflow:
    build: ./ellipse-workflow
    container_name: ellipse-workflow
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: sqlauth
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=EllipseDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.microsoft.sqlserver.jdbc.SQLServerDriver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${ELLIPSE_SQL_SA_PASSWORD:-Ellipse_Dev_Sql_2026!}
      FLOWABLE_CALLBACK_ENABLED: "false"
      DOTNET_CALLBACK_BASE_URL: http://host.docker.internal:5190
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: ellipse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${MINIO_DATA_PATH:-D:/MinIO/data}:/data
    profiles: ["full"]

  web:
    image: nginx:1.27-alpine
    container_name: ellipse-web
    ports:
      - "8088:80"
    volumes:
      - ./ellipse-frontend/dist:/usr/share/nginx/html:ro
      - ./ellipse-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["web"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ellipse-sql-data:
